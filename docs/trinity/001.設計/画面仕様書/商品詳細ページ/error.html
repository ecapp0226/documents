<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <title>エラー | SUNABA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Segoe UI', 'Hiragino Sans', sans-serif; background: #f9fafb; }
  </style>
</head>
<body>

<!-- ヘッダー -->
<header class="bg-white shadow-sm sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
    <a href="../トップページ/top.html" class="shrink-0"><img src="../header_logo.png" alt="SUNABA" class="h-8"></a>
    <div class="flex-1 max-w-xl">
      <div class="relative">
        <input type="text" placeholder="商品を検索..." class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <span class="absolute right-3 top-2.5 text-gray-400">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
          </svg>
        </span>
      </div>
    </div>
    <div class="flex items-center gap-4 shrink-0">
      <a href="../カートページ/cart.html" class="relative text-gray-600 hover:text-blue-600">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
        </svg>
      </a>
    </div>
  </div>
</header>

<main class="max-w-3xl mx-auto px-4 py-16">

  <!-- 404エラー -->
  <div class="bg-white rounded-2xl shadow-sm p-12 text-center mb-12">
    <div class="text-6xl mb-4">🔍</div>
    <h2 class="text-xl font-bold text-gray-900 mb-2">お探しの商品は見つかりませんでした。</h2>
    <p class="text-sm text-gray-500 mb-6">削除されたか、URLが間違っている可能性があります。</p>
    <a href="../トップページ/top.html" class="inline-block bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">TOPへ戻る</a>
  </div>

  <!-- 500エラー -->
  <div class="bg-white rounded-2xl shadow-sm p-12 text-center">
    <div class="text-6xl mb-4">⚠️</div>
    <h2 class="text-xl font-bold text-gray-900 mb-2">エラーが発生しました</h2>
    <p class="text-sm text-gray-500 mb-6">しばらく時間をおいて再度お試しください。</p>
    <div class="flex justify-center gap-4">
      <button class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">再読み込み</button>
      <a href="../トップページ/top.html" class="border border-gray-300 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-50 transition">TOPへ戻る</a>
    </div>
  </div>

</main>

<footer class="bg-gray-800 text-gray-400 text-center py-6 text-sm">
  © 2025 SUNABA. All rights reserved.
</footer>

</body>
</html>
